"use strict";

/*
  ANSWER INDEX:
  0 = A
  1 = B
  2 = C
  3 = D

const questions = [

/* ==================================================
   TOPIC 1: LACTOSE DIGESTION AND GALACTOSE METABOLISM
================================================== */

{
topic:"Lactose digestion and galactose metabolism",
q:"A 3-week-old infant develops jaundice, hepatomegaly, vomiting and poor feeding after breast milk is introduced. Laboratory tests show elevated galactose-1-phosphate. Which enzyme is most likely deficient?",
o:["Galactokinase","Galactose-1-phosphate uridyltransferase","Aldolase B","Fructokinase"],
a:1,
e:"Classic galactosaemia results from deficiency of galactose-1-phosphate uridyltransferase (GALT). Galactose-1-phosphate accumulates and damages the liver, kidneys and nervous system. Galactokinase deficiency usually produces a milder disorder dominated by cataracts."
},

{
topic:"Lactose digestion and galactose metabolism",
q:"An infant develops bilateral cataracts but has no significant liver dysfunction. Blood tests reveal increased galactose. Which enzyme deficiency is the most likely cause?",
o:["Galactokinase","Lactase","GALT","Glucose-6-phosphatase"],
a:0,
e:"Galactokinase deficiency causes accumulation of galactose. Galactose is reduced to galactitol by aldose reductase. Galactitol accumulates in the lens, causing osmotic damage and cataracts."
},

{
topic:"Lactose digestion and galactose metabolism",
q:"A child develops abdominal distension, flatulence and watery diarrhoea after consuming milk. Symptoms disappear when lactose-free milk is given. Which enzyme is deficient?",
o:["Sucrase","Maltase","Lactase","Pancreatic amylase"],
a:2,
e:"Lactase is located on the intestinal brush border and hydrolyses lactose into glucose and galactose. Its deficiency causes lactose malabsorption, osmotic diarrhoea and bacterial fermentation."
},

{
topic:"Lactose digestion and galactose metabolism",
q:"A newborn with classic galactosaemia is placed on a restricted diet. Which dietary substances should be avoided?",
o:["Glucose and starch","Lactose and galactose","Cellulose and glycogen","Sucrose and maltose only"],
a:1,
e:"Lactose is hydrolysed into glucose and galactose. Restricting lactose and galactose reduces the accumulation of toxic galactose metabolites. Milk products are therefore avoided."
},

{
topic:"Lactose digestion and galactose metabolism",
q:"A child with untreated classic galactosaemia develops cataracts. Which metabolite accumulates in the lens and contributes directly to this complication?",
o:["Galactitol","Lactate","Fructose-1-phosphate","Glucose-6-phosphate"],
a:0,
e:"Galactose is reduced to galactitol by aldose reductase. Galactitol accumulates in the lens, causing osmotic swelling and cataract formation."
},

/* ==================================================
   TOPIC 2: SUCROSE DIGESTION AND FRUCTOSE METABOLISM
================================================== */

{
topic:"Sucrose digestion and fructose metabolism",
q:"A child develops vomiting, hypoglycaemia and hepatomegaly after eating fruit. Symptoms are particularly severe after fruit juice consumption. Which enzyme is deficient?",
o:["Fructokinase","Aldolase B","Galactokinase","Lactase"],
a:1,
e:"Aldolase B deficiency causes hereditary fructose intolerance. Fructose-1-phosphate accumulates and traps inorganic phosphate, impairing glycogenolysis and gluconeogenesis. Severe hypoglycaemia follows fructose ingestion."
},

{
topic:"Sucrose digestion and fructose metabolism",
q:"A healthy child has persistent fructose in the urine after consuming fruit but remains asymptomatic. Which enzyme deficiency explains this condition?",
o:["Aldolase B","Fructokinase","Phosphofructokinase-1","Pyruvate kinase"],
a:1,
e:"Fructokinase deficiency causes essential fructosuria. Fructose is not efficiently phosphorylated in the liver and is excreted in urine. The condition is generally benign."
},

{
topic:"Sucrose digestion and fructose metabolism",
q:"A patient with hereditary fructose intolerance is advised to avoid certain sweeteners. Which substance can produce fructose after digestion and should therefore be avoided?",
o:["Glucose","Sucrose","Maltose","Lactose-free glucose solution"],
a:1,
e:"Sucrose is hydrolysed by sucrase into glucose and fructose. Fructose exposure can trigger severe hypoglycaemia and liver dysfunction in hereditary fructose intolerance."
},

{
topic:"Sucrose digestion and fructose metabolism",
q:"A patient develops bloating and diarrhoea after consuming sucrose-containing foods. Which intestinal enzyme normally hydrolyses sucrose?",
o:["Lactase","Sucrase","Pepsin","Trypsin"],
a:1,
e:"Sucrase, part of the sucrase-isomaltase complex, hydrolyses sucrose into glucose and fructose at the small-intestinal brush border."
},

{
topic:"Sucrose digestion and fructose metabolism",
q:"A patient with hereditary fructose intolerance develops severe hypoglycaemia after receiving a fructose-containing intravenous preparation. What is the major biochemical mechanism?",
o:["Increased insulin sensitivity","Fructose-1-phosphate accumulation with phosphate depletion","Excess glycogen synthesis","Increased glucose absorption"],
a:1,
e:"Aldolase B deficiency causes fructose-1-phosphate accumulation. This traps phosphate and lowers ATP availability, inhibiting glycogenolysis and gluconeogenesis."
},

/* ==================================================
   TOPIC 3: POLYSACCHARIDES AND CELLULOSE
================================================== */

{
topic:"Polysaccharides digestion and cellulose",
q:"A patient asks why eating cellulose does not significantly increase blood glucose in humans. Which explanation is correct?",
o:["Cellulose contains beta-1,4 glycosidic bonds that humans cannot digest","Cellulose contains alpha-1,4 bonds that are resistant to all enzymes","Cellulose is made entirely of fructose","Cellulose is absorbed intact through the intestine"],
a:0,
e:"Cellulose contains beta-1,4 glycosidic bonds. Humans lack cellulase, the enzyme required to hydrolyse these bonds. Cellulose therefore acts as dietary fibre."
},

{
topic:"Polysaccharides digestion and cellulose",
q:"A patient increases dietary fibre intake to improve bowel movements. What is an important physiological effect of cellulose?",
o:["It is completely converted to glucose in the small intestine","It adds bulk to stool and promotes intestinal movement","It directly stimulates insulin secretion","It is stored as liver glycogen"],
a:1,
e:"Cellulose is largely indigestible in humans. It increases stool bulk, retains water and supports normal intestinal motility."
},

{
topic:"Polysaccharides digestion and cellulose",
q:"A laboratory compares starch and cellulose. Which structural feature makes starch digestible by human amylases?",
o:["Its beta-1,4 bonds","Its alpha-1,4 bonds","Its peptide bonds","Its phosphodiester bonds"],
a:1,
e:"Starch contains alpha-1,4 glycosidic bonds in amylose and alpha-1,4 plus alpha-1,6 bonds in amylopectin. Human amylases hydrolyse alpha-1,4 bonds."
},

{
topic:"Polysaccharides digestion and cellulose",
q:"A patient has difficulty digesting a polysaccharide containing numerous alpha-1,6 branch points. Which enzyme activity is needed to remove these branch points?",
o:["Lactase","Debranching enzyme activity","Pepsin","Glucose-6-phosphatase"],
a:1,
e:"The alpha-1,6 bonds at starch branch points are not cleaved by alpha-amylase. Isomaltase activity of the intestinal brush border helps hydrolyse these bonds."
},

{
topic:"Polysaccharides digestion and cellulose",
q:"A patient consumes a meal containing amylose and amylopectin. Which statement correctly describes amylopectin?",
o:["It is a completely unbranched polymer of beta-glucose","It contains alpha-1,4 chains with alpha-1,6 branch points","It contains only beta-1,4 linkages","It is composed of fructose units"],
a:1,
e:"Amylopectin is a branched glucose polymer. Its main chains contain alpha-1,4 bonds and its branch points contain alpha-1,6 bonds."
},

/* ==================================================
   TOPIC 4: STARCH DIGESTION AND GLUCOSE ABSORPTION
================================================== */

{
topic:"Starch digestion and glucose absorption",
q:"A patient with pancreatic insufficiency has impaired starch digestion in the small intestine. Which enzyme is primarily responsible for luminal starch digestion?",
o:["Pancreatic alpha-amylase","Lactase","Pepsin","Sucrase"],
a:0,
e:"Pancreatic alpha-amylase hydrolyses internal alpha-1,4 bonds in starch, producing maltose, maltotriose and alpha-limit dextrins."
},

{
topic:"Starch digestion and glucose absorption",
q:"A patient has impaired absorption of glucose and galactose but relatively preserved fructose absorption. Which apical intestinal transporter is most likely defective?",
o:["GLUT5","SGLT1","GLUT4","GLUT2"],
a:1,
e:"SGLT1 transports glucose and galactose into enterocytes by sodium-dependent secondary active transport. GLUT5 is responsible for apical fructose uptake."
},

{
topic:"Starch digestion and glucose absorption",
q:"A researcher studies the movement of absorbed glucose from an intestinal epithelial cell into portal blood. Which transporter is mainly responsible?",
o:["GLUT4","GLUT5","GLUT2","SGLT1"],
a:2,
e:"GLUT2 is located on the basolateral membrane of enterocytes and facilitates movement of absorbed monosaccharides into portal blood."
},

{
topic:"Starch digestion and glucose absorption",
q:"A patient with normal salivary function begins chewing a piece of bread. Which enzyme starts starch digestion in the oral cavity?",
o:["Salivary alpha-amylase","Pepsin","Trypsin","Maltase"],
a:0,
e:"Salivary alpha-amylase begins hydrolysis of alpha-1,4 bonds in starch. Its activity decreases when food enters the acidic stomach."
},

{
topic:"Starch digestion and glucose absorption",
q:"A patient has reduced activity of pancreatic alpha-amylase. Which products of starch digestion will be reduced?",
o:["Maltose and maltotriose","Amino acids and peptides","Fatty acids and glycerol","Galactose and lactose"],
a:0,
e:"Alpha-amylase produces maltose, maltotriose and alpha-limit dextrins from starch. These products are subsequently processed by brush-border enzymes."
},

/* ==================================================
   TOPIC 5: TRANSIENT HYPERGLYCAEMIA AND INSULIN RELEASE
================================================== */

{
topic:"Transient hyperglycaemia and insulin release",
q:"A healthy individual develops a temporary rise in blood glucose after a carbohydrate-rich meal. Which pancreatic cells respond by secreting insulin?",
o:["Alpha cells","Beta cells","Delta cells","PP cells"],
a:1,
e:"Pancreatic beta cells detect increased glucose metabolism and release insulin. Insulin promotes glucose uptake and storage and helps return blood glucose towards normal."
},

{
topic:"Transient hyperglycaemia and insulin release",
q:"A laboratory studies insulin secretion from pancreatic beta cells. Increased glucose metabolism raises ATP levels. What happens next?",
o:["ATP-sensitive potassium channels open","ATP-sensitive potassium channels close","Calcium channels close","The cell becomes hyperpolarised"],
a:1,
e:"Increased ATP closes ATP-sensitive potassium channels. Reduced potassium efflux causes membrane depolarisation, opening voltage-gated calcium channels and triggering insulin exocytosis."
},

{
topic:"Transient hyperglycaemia and insulin release",
q:"A patient has a defective glucose-sensing mechanism in pancreatic beta cells. Which enzyme normally plays an important role in glucose sensing?",
o:["Glucokinase","Lactase","Aldolase B","Glucose-6-phosphatase"],
a:0,
e:"Glucokinase phosphorylates glucose in pancreatic beta cells and acts as a glucose sensor. Its activity contributes to the ATP rise that triggers insulin secretion."
},

{
topic:"Transient hyperglycaemia and insulin release",
q:"A healthy person has increased insulin secretion after a mixed meal compared with an equivalent intravenous glucose load. Which intestinal hormones contribute to this effect?",
o:["Incretins such as GLP-1 and GIP","Thyroxine and cortisol","Glucagon and adrenaline","Aldosterone and renin"],
a:0,
e:"GLP-1 and GIP are incretin hormones released from the gut after nutrient ingestion. They enhance glucose-dependent insulin secretion and contribute to the incretin effect."
},

{
topic:"Transient hyperglycaemia and insulin release",
q:"A patient has increased insulin secretion after a meal. Which immediate effect helps reduce postprandial blood glucose?",
o:["Increased glucose uptake into skeletal muscle and adipose tissue","Increased hepatic glucose output","Increased glycogen breakdown","Inhibition of glucose uptake into muscle"],
a:0,
e:"Insulin promotes GLUT4 translocation in skeletal muscle and adipose tissue, increasing glucose uptake. It also promotes glycogenesis and suppresses hepatic glucose production."
},

/* ==================================================
   TOPIC 6: GLUCOSE TRANSPORTERS AND UTILIZATION
================================================== */

{
topic:"Glucose transporters and glucose utilization",
q:"A patient with type 1 diabetes has reduced insulin-dependent glucose uptake into skeletal muscle. Which transporter is primarily responsible?",
o:["GLUT1","GLUT2","GLUT3","GLUT4"],
a:3,
e:"GLUT4 is insulin-responsive and is found mainly in skeletal muscle and adipose tissue. Insulin stimulates its translocation to the plasma membrane."
},

{
topic:"Glucose transporters and glucose utilization",
q:"A researcher studies glucose uptake by erythrocytes. Which transporter mediates their basal insulin-independent glucose uptake?",
o:["GLUT1","GLUT4","GLUT5","SGLT1"],
a:0,
e:"GLUT1 mediates basal insulin-independent glucose transport in erythrocytes and several other tissues."
},

{
topic:"Glucose transporters and glucose utilization",
q:"A patient has a defect in the major glucose transporter responsible for glucose uptake into neurons. Which transporter is most relevant?",
o:["GLUT4","GLUT3","GLUT5","SGLT1"],
a:1,
e:"GLUT3 is a high-affinity glucose transporter found prominently in neurons, ensuring glucose uptake even when blood glucose is relatively low."
},

{
topic:"Glucose transporters and glucose utilization",
q:"A patient has impaired hepatic glucose uptake after a meal. Which transporter normally allows glucose to move into and out of hepatocytes?",
o:["GLUT1","GLUT2","GLUT3","GLUT4"],
a:1,
e:"GLUT2 is a high-capacity, bidirectional glucose transporter in hepatocytes. It allows glucose movement according to the concentration gradient."
},

{
topic:"Glucose transporters and glucose utilization",
q:"A child has a defect in fructose absorption across the apical membrane of intestinal enterocytes. Which transporter is most likely affected?",
o:["GLUT2","GLUT4","GLUT5","GLUT1"],
a:2,
e:"GLUT5 is the main apical intestinal fructose transporter. GLUT2 is mainly responsible for basolateral movement of absorbed monosaccharides."
},

/* ==================================================
   TOPIC 7: GLYCOLYSIS
================================================== */

{
topic:"Glycolysis",
q:"A patient in septic shock develops lactic acidosis due to tissue hypoxia. Which reaction helps maintain glycolysis under anaerobic conditions?",
o:["Pyruvate conversion to lactate","Acetyl-CoA conversion to citrate","Glucose conversion to glycogen","Lactate conversion to acetyl-CoA in the cytosol"],
a:0,
e:"Lactate dehydrogenase converts pyruvate to lactate while oxidising NADH to NAD+. Regeneration of NAD+ permits glycolysis to continue."
},

{
topic:"Glycolysis",
q:"A patient with an inherited pyruvate kinase deficiency presents with chronic haemolytic anaemia. Why are erythrocytes particularly affected?",
o:["They depend entirely on glycolysis for ATP","They obtain ATP mainly from mitochondria","They perform extensive fatty acid oxidation","They synthesise glucose through gluconeogenesis"],
a:0,
e:"Mature erythrocytes lack mitochondria and depend on glycolysis for ATP. Pyruvate kinase deficiency reduces ATP production and compromises red cell membrane integrity."
},

{
topic:"Glycolysis",
q:"A patient with severe hypoxia has increased anaerobic glycolysis. Which enzyme catalyses the rate-limiting step of glycolysis?",
o:["Hexokinase","Phosphofructokinase-1","Enolase","Pyruvate kinase"],
a:1,
e:"Phosphofructokinase-1 converts fructose-6-phosphate to fructose-1,6-bisphosphate. It is the major rate-limiting and regulatory enzyme of glycolysis."
},

{
topic:"Glycolysis",
q:"A patient with a genetic deficiency of phosphofructokinase develops exercise intolerance and muscle cramps. Which metabolic disorder is most likely?",
o:["Von Gierke disease","McArdle disease","Tarui disease","Pompe disease"],
a:2,
e:"Tarui disease (glycogen storage disease type VII) is caused by muscle phosphofructokinase deficiency. It impairs glycolysis and causes exercise intolerance and muscle cramps."
},

{
topic:"Glycolysis",
q:"A laboratory measures ATP production during anaerobic glycolysis from one molecule of glucose to two molecules of lactate. What is the net ATP yield?",
o:["1 ATP","2 ATP","4 ATP","8 ATP"],
a:1,
e:"Glycolysis produces four ATP but consumes two ATP during its preparatory phase. The net gain is two ATP per glucose molecule under anaerobic conditions."
},

/* ==================================================
   TOPIC 8: PYRUVATE DEHYDROGENASE COMPLEX
================================================== */

{
topic:"Pyruvate dehydrogenase complex",
q:"A patient with chronic alcohol misuse develops neurological symptoms and lactic acidosis due to thiamine deficiency. Which PDH cofactor is derived from vitamin B1?",
o:["FAD","NAD+","Thiamine pyrophosphate","Coenzyme A"],
a:2,
e:"Thiamine pyrophosphate (TPP), derived from vitamin B1, is required by the E1 component of the pyruvate dehydrogenase complex."
},

{
topic:"Pyruvate dehydrogenase complex",
q:"A patient exposed to arsenic develops impaired oxidative decarboxylation of pyruvate. Which PDH cofactor is particularly affected?",
o:["Lipoic acid","FAD","NAD+","Thiamine"],
a:0,
e:"Arsenite binds to the sulfhydryl groups of lipoic acid, inhibiting pyruvate dehydrogenase and alpha-ketoglutarate dehydrogenase."
},

{
topic:"Pyruvate dehydrogenase complex",
q:"An infant with a genetic pyruvate dehydrogenase deficiency develops neurological abnormalities and lactic acidosis. Which metabolite is expected to accumulate?",
o:["Acetyl-CoA","Pyruvate","Citrate","Oxaloacetate"],
a:1,
e:"PDH deficiency prevents efficient conversion of pyruvate to acetyl-CoA. Pyruvate accumulates and is diverted towards lactate and alanine production."
},

{
topic:"Pyruvate dehydrogenase complex",
q:"A patient has increased ATP production and a high mitochondrial NADH/NAD+ ratio. What is the expected effect on pyruvate dehydrogenase activity?",
o:["Activation","Inhibition","No regulation","Irreversible stimulation"],
a:1,
e:"High ATP and NADH indicate sufficient energy and inhibit PDH. PDH kinase phosphorylates and inactivates the complex. Pyruvate, ADP and calcium favour activation."
},

{
topic:"Pyruvate dehydrogenase complex",
q:"A laboratory investigates the products of the pyruvate dehydrogenase reaction. Which set is produced when pyruvate is converted to acetyl-CoA?",
o:["Acetyl-CoA, NADH and CO2","Lactate, ATP and oxygen","Glucose, NADPH and CO2","Oxaloacetate, FADH2 and water"],
a:0,
e:"PDH catalyses oxidative decarboxylation of pyruvate to acetyl-CoA, producing NADH and carbon dioxide."
},

/* ==================================================
   TOPIC 9: TCA CYCLE
================================================== */

{
topic:"TCA cycle",
q:"A patient has impaired mitochondrial energy production. Most TCA cycle reactions occur in which cellular compartment?",
o:["Cytosol","Mitochondrial matrix","Nucleus","Lysosome"],
a:1,
e:"Most TCA cycle enzymes are located in the mitochondrial matrix. Succinate dehydrogenase is the exception and is embedded in the inner mitochondrial membrane."
},

{
topic:"TCA cycle",
q:"A patient has reduced activity of succinate dehydrogenase. Which electron transport chain complex will also be affected?",
o:["Complex I","Complex II","Complex III","Complex IV"],
a:1,
e:"Succinate dehydrogenase catalyses conversion of succinate to fumarate in the TCA cycle and also functions as Complex II of the electron transport chain."
},

{
topic:"TCA cycle",
q:"A laboratory measures energy production from one molecule of acetyl-CoA entering the TCA cycle. Using modern ATP equivalents, which yield is closest?",
o:["2 ATP","5 ATP","10 ATP","15 ATP"],
a:2,
e:"One acetyl-CoA produces 3 NADH (about 7.5 ATP), 1 FADH2 (about 1.5 ATP) and 1 GTP (1 ATP), giving approximately 10 ATP."
},

{
topic:"TCA cycle",
q:"A patient has impaired isocitrate dehydrogenase activity. Which products are normally generated when isocitrate is converted to alpha-ketoglutarate?",
o:["NADH and CO2","FADH2 and water","ATP and oxygen","Lactate and NADPH"],
a:0,
e:"Isocitrate dehydrogenase catalyses oxidative decarboxylation of isocitrate, producing alpha-ketoglutarate, NADH and CO2."
},

{
topic:"TCA cycle",
q:"A patient with severe vitamin deficiency has reduced activity of alpha-ketoglutarate dehydrogenase. Which cofactor is required by this enzyme complex?",
o:["Thiamine pyrophosphate","Biotin only","Vitamin K","Ascorbic acid"],
a:0,
e:"Alpha-ketoglutarate dehydrogenase requires the same five major cofactors as PDH: TPP, lipoic acid, CoA, FAD and NAD+."
},

/* ==================================================
   TOPIC 10: OXIDATIVE PHOSPHORYLATION AND ETC
================================================== */

{
topic:"Oxidative phosphorylation and ETC",
q:"A patient with cyanide poisoning develops severe cellular hypoxia despite adequate oxygen delivery. Which ETC complex is inhibited?",
o:["Complex I","Complex II","Complex III","Complex IV"],
a:3,
e:"Cyanide inhibits cytochrome c oxidase (Complex IV), preventing the transfer of electrons to oxygen, the final electron acceptor."
},

{
topic:"Oxidative phosphorylation and ETC",
q:"A patient is exposed to rotenone. Electron transfer from NADH to coenzyme Q is blocked. Which complex is affected?",
o:["Complex I","Complex II","Complex III","Complex IV"],
a:0,
e:"Rotenone inhibits Complex I (NADH dehydrogenase), preventing electron transfer from NADH to coenzyme Q."
},

{
topic:"Oxidative phosphorylation and ETC",
q:"A laboratory experiment uses antimycin A to inhibit mitochondrial respiration. Which complex is directly affected?",
o:["Complex I","Complex II","Complex III","Complex V"],
a:2,
e:"Antimycin A inhibits Complex III, also called the cytochrome bc1 complex, blocking electron transfer to cytochrome c."
},

{
topic:"Oxidative phosphorylation and ETC",
q:"A laboratory adds oligomycin to isolated mitochondria. Which process is directly inhibited?",
o:["ATP synthase proton channel","Complex I electron transfer","Complex IV oxygen binding","Pyruvate oxidation"],
a:0,
e:"Oligomycin blocks the F0 proton channel of ATP synthase (Complex V), preventing proton re-entry and ATP production."
},

/* ==================================================
   QUIZ ENGINE
================================================== */

const TOTAL = questions.length;
let current = 0;
let answers = Array(TOTAL).fill(null);
let submitted = false;

const $ = id => document.getElementById(id);

function initialise() {
  if (TOTAL !== 75) {
    alert("Question bank error: expected 75 questions, found " + TOTAL);
  }

  $("navGrid").innerHTML = "";

  questions.forEach((q,i) => {
    const b = document.createElement("button");
    b.className = "nav";
    b.textContent = i + 1;
    b.addEventListener("click", () => {
      if (submitted) return;
      current = i;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    $("navGrid").appendChild(b);
  });

  render();
}

function render() {
  const q = questions[current];

  $("progressText").textContent =
    `Question ${current+1} of ${TOTAL}`;

  $("percentText").textContent =
    `${Math.round((current+1)/TOTAL*100)}%`;

  $("progressFill").style.width =
    `${(current+1)/TOTAL*100}%`;

  $("topic").textContent = q.topic.toUpperCase();

  $("question").textContent = q.q;

  $("options").innerHTML = "";

  q.o.forEach((opt,j) => {
    const div = document.createElement("div");
    div.className = "option";

    if (answers[current] === j) {
      div.classList.add("selected");
    }

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = "ABCD"[j] + ".";

    const text = document.createElement("span");
    text.className = "optiontext";
    text.textContent = opt;

    div.append(letter,text);

    div.addEventListener("click", () => {
      if (submitted) return;
      answers[current] = j;
      render();
    });

    $("options").appendChild(div);
  });

  [...$("navGrid").children].forEach((b,i) => {
    b.classList.toggle("answered", answers[i] !== null);
    b.classList.toggle("current", i === current);
  });

  $("prev").disabled = current === 0;
  $("next").disabled = current === TOTAL-1;

  $("answeredCount").textContent =
    `${answers.filter(a=>a!==null).length} of ${TOTAL} questions answered`;
}

$("prev").onclick = () => {
  if(current > 0) {
    current--;
    render();
  }
};

$("next").onclick = () => {
  if(current < TOTAL-1) {
    current++;
    render();
  }
};

function performanceRemark(p) {
  if(p >= 80)
    return "Excellent performance. Strong mastery of the topic. Review the few missed concepts and continue with application-based practice.";

  if(p >= 70)
    return "Very good performance. Your understanding is solid, but revise the areas responsible for your missed questions.";

  if(p >= 60)
    return "Good performance, but there are some knowledge gaps. Revisit the important mechanisms and relationships before moving on.";

  if(p >= 50)
    return "Borderline performance. The basic foundation is present, but you need another focused revision and more active recall.";

  return "Needs significant revision. Re-study the core concepts, practise active recall, and retake the quiz before progressing.";
}

/* ==================================================
   SUBMISSION
================================================== */

$("submit").onclick = () => {
  const unanswered = answers.filter(a=>a===null).length;

  if(unanswered > 0) {
    if(!confirm(`${unanswered} questions are unanswered. Submit anyway?`)) {
      return;
    }
  }

  submitQuiz();
};

function submitQuiz() {
  if(submitted) return;
  submitted = true;

  let correct=0,wrong=0,unanswered=0;

  questions.forEach((q,i) => {
    if(answers[i] === null) unanswered++;
    else if(answers[i] === q.a) correct++;
    else wrong++;
  });

  const percentage = Math.round(correct/TOTAL*100);

  $("navigationCard").classList.add("hidden");
  $("quizCard").classList.add("hidden");

  $("results").classList.remove("hidden");

  $("results").innerHTML = `
    <h2>YOUR EXAMINATION RESULTS</h2>

    <div class="metrics">
      <div class="metric">
        <strong>${correct}/${TOTAL}</strong>
        <span>TOTAL SCORE</span>
      </div>

      <div class="metric">
        <strong>${percentage}%</strong>
        <span>PERCENTAGE</span>
      </div>

      <div class="metric">
        <strong>${correct}</strong>
        <span>CORRECT</span>
      </div>

      <div class="metric">
        <strong>${wrong}</strong>
        <span>INCORRECT</span>
      </div>

      <div class="metric">
        <strong>${unanswered}</strong>
        <span>UNANSWERED</span>
      </div>
    </div>

    <div class="remark">
      <b>PERFORMANCE REMARK</b>
      <p>${performanceRemark(percentage)}</p>
    </div>

    <button class="action retake" onclick="restartQuiz()">
      RETAKE QUIZ
    </button>
  `;

  showCorrections();
  window.scrollTo(0,0);
}

/* ==================================================
   FULL CORRECTIONS
================================================== */

function showCorrections() {
  $("corrections").classList.remove("hidden");
  $("correctionList").innerHTML = "";

  questions.forEach((q,i) => {
    const chosen = answers[i];
    const isCorrect = chosen === q.a;

    const status = chosen === null
      ? "⚪ UNANSWERED"
      : isCorrect
        ? "🟢 CORRECT"
        : "🔴 INCORRECT";

    const box = document.createElement("div");
    box.className = "correction";

    const heading = document.createElement("h3");
    heading.textContent = `QUESTION ${i+1}`;

    const topic = document.createElement("p");
    topic.className = "small";
    topic.textContent = q.topic;

    const question = document.createElement("p");
    question.textContent = q.q;

    const result = document.createElement("p");
    result.className = "status " +
      (chosen === null ? "na" : isCorrect ? "good" : "bad");
    result.textContent = status;

    const yourAnswer = document.createElement("p");
    yourAnswer.textContent = "Your answer: " +
      (chosen === null
        ? "No answer selected"
        : "ABCD"[chosen] + ". " + q.o[chosen]);

    const correctAnswer = document.createElement("p");
    correctAnswer.textContent =
      "Correct answer: " + "ABCD"[q.a] + ". " + q.o[q.a];

    box.append(heading,topic,question,result,yourAnswer,correctAnswer);

    q.o.forEach((opt,j) => {
      const row = document.createElement("div");
      row.className = "option";

      if(j === q.a) {
        row.classList.add("correct");
      } else if(j === chosen) {
        row.classList.add("wrong");
      }

      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = "ABCD"[j] + ".";

      const text = document.createElement("span");
      text.className = "optiontext";
      text.textContent = opt;

      const tag = document.createElement("span");
      tag.className = "tag";

      if(j === q.a) {
        tag.textContent = "✓ CORRECT ANSWER";
      } else if(j === chosen) {
        tag.textContent = "✗ YOUR ANSWER";
      }

      row.append(letter,text,tag);
      box.appendChild(row);
    });

    const explanation = document.createElement("p");
    explanation.className = "explanation";
    explanation.innerHTML = "<b>EXPLANATION:</b> ";

    const explanationText = document.createElement("span");
    explanationText.textContent = q.e;

    explanation.appendChild(explanationText);
    box.appendChild(explanation);

    $("correctionList").appendChild(box);
  });
}

/* ==================================================
   RETAKE
================================================== */

function restartQuiz() {
  current = 0;
  answers = Array(TOTAL).fill(null);
  submitted = false;

  $("navigationCard").classList.remove("hidden");
  $("quizCard").classList.remove("hidden");
  $("results").classList.add("hidden");
  $("corrections").classList.add("hidden");

  render();
  window.scrollTo(0,0);
}

initialise();

</script>
